<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<style>
  :root { --fg:#f4f5f7; --muted:#8b8f98; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:system-ui,-apple-system,sans-serif; overflow:hidden; }
  .zh-cmn, .zh-yue { font-family:"Noto Sans TC","Noto Sans HK","PingFang HK","Chiron Hei HK",
    "Hiragino Sans GB","Microsoft JhengHei",system-ui,sans-serif; line-height:1.16; font-weight:500; }

  /* ambient wave-ring — always animating, behind everything; recedes on result */
  #viz { position:fixed; inset:0; z-index:1; pointer-events:none; transition:opacity .6s ease; }
  body[data-state="result"] #viz { opacity:0; }

  /* input: big auto-fitting editable text over the circle (transparent) */
  #stage { position:fixed; left:0; right:0; top:0; height:100%; z-index:2;
    display:flex; align-items:center; justify-content:center; padding:5vh 6vw;
    transition:opacity .4s ease; }
  body[data-state="result"] #stage { opacity:0; pointer-events:none; }
  #compose { outline:none; background:transparent; color:var(--fg); font-weight:500;
    line-height:1.24; text-align:center; width:100%; max-width:92vw; word-break:break-word;
    caret-color:#7c9cff; }
  #compose:empty:before { content:attr(data-ph); color:var(--muted); font-weight:400; }

  /* send arrow — same white/weight/font as the words */
  #submit { position:fixed; right:5vw; top:50%; transform:translateY(-50%); z-index:8; display:none;
    background:none; border:none; cursor:pointer; font-family:inherit; color:var(--fg); font-weight:500;
    line-height:1; font-size:2.8rem; padding:.2rem .5rem; transition:opacity .15s ease, transform .12s ease; }
  #submit:active { transform:translateY(-50%) scale(.86); opacity:.55; }
  body[data-state="input"] #submit.show { display:block; }
  /* sending cue: bouncing ellipses where the arrow was (no text pulsing) */
  #dots { position:fixed; right:5vw; top:50%; transform:translateY(-50%); z-index:8; display:none;
    align-items:center; gap:7px; }
  body[data-state="sending"] #dots { display:flex; }
  #dots span { width:9px; height:9px; border-radius:50%; background:var(--fg); display:block;
    animation:dotbounce 1.1s ease-in-out infinite; }
  #dots span:nth-child(2){ animation-delay:.15s; }
  #dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes dotbounce { 0%,70%,100%{ transform:translateY(0); opacity:.35; } 35%{ transform:translateY(-9px); opacity:1; } }

  /* two columns, EQUAL weight; each cell shrinks to its text so it can be scaled up to fill */
  #result { position:fixed; inset:0; z-index:3; padding:2.4vh 2vw 20px;
    display:flex; flex-direction:row; align-items:stretch;
    opacity:0; transform:translateY(16px); pointer-events:none;
    transition:opacity .5s ease, transform .55s cubic-bezier(.2,.9,.2,1); }
  body[data-state="result"] #result { opacity:1; transform:none; pointer-events:auto; }
  .col { flex:1 1 0; min-width:0; padding:0 3vw; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
  .col.scroll { justify-content:flex-start; }
  .col::-webkit-scrollbar { width:4px; }
  .col::-webkit-scrollbar-thumb { background:#ffffff2a; border-radius:4px; }
  .vline { width:1px; background:#ffffff12; align-self:stretch; margin:6vh 0; }
  .label { font-size:.58rem; letter-spacing:.24em; text-transform:uppercase;
    color:var(--muted); margin-bottom:.5rem; }
  .cell { display:inline-block; max-width:100%; }
  .err { color:#ff8a80; font-size:1.05rem; text-align:center; }

  /* sleek chrome-less controls — no box, no border */
  .chip { background:none; border:none; color:var(--muted); font-family:inherit; font-size:.95rem;
    font-weight:500; letter-spacing:.03em; cursor:pointer; padding:.4rem .5rem;
    display:inline-flex; align-items:center; gap:.4rem; transition:color .15s ease, opacity .15s ease; }
  .chip:active { opacity:.5; }
  #cog { position:fixed; left:14px; top:12px; z-index:9; opacity:.55; }
  #verify { position:fixed; right:16px; bottom:16px; z-index:9; display:none; }
  body[data-state="result"] #verify { display:inline-block; }
  #newbtn { position:fixed; left:16px; bottom:16px; z-index:9; display:none; }
  body[data-state="result"] #newbtn { display:inline-block; }
  /* verify: the 🌐 turns into bouncing dots while re-checking (no separate box) */
  #verify .vdots { display:none; }
  #verify.loading .gicon { display:none; }
  #verify.loading .vdots { display:inline-flex; align-items:center; gap:5px; }
  #verify .vdots i { width:6px; height:6px; border-radius:50%; background:currentColor; display:block;
    animation:dotbounce 1.1s ease-in-out infinite; }
  #verify .vdots i:nth-child(2){ animation-delay:.15s; }
  #verify .vdots i:nth-child(3){ animation-delay:.3s; }
  /* pronunciation pop-out (reading + small definition) */
  /* click-through: the pop-out must never swallow the tap meant for the next word */
  #pop { position:fixed; z-index:10; display:none; pointer-events:none;
    background:#0d1017f2; border:1px solid #ffffff1f;
    border-radius:14px; padding:.55rem .95rem; box-shadow:0 8px 30px #000a;
    text-align:center; max-width:min(66vw,380px); }
  /* each dictionary word is its own tap target, with padding bled back out so layout is unchanged */
  .w { cursor:pointer; padding:.14em .06em; margin:-.14em -.06em; border-radius:.08em; }
  .w:active { background:#ffffff1f; }
  #pop .prd { font-size:1.7rem; font-weight:600; letter-spacing:.02em; }
  #pop .pdef { font-size:.82rem; font-weight:400; color:var(--muted); margin-top:.28rem; line-height:1.3; }
  .spk { background:none; border:none; padding:0 0 0 6px; cursor:pointer; vertical-align:middle; line-height:0; }
  .spk svg { width:15px; height:15px; fill:none; stroke:var(--muted); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .spk:active svg { stroke:var(--fg); }
  .spk.playing svg { stroke:#7c9cff; }
  .spk.loading svg { animation:spkpulse 1s ease-in-out infinite; }
  .spk.err svg { stroke:#ff8a80; }
  @keyframes spkpulse { 0%,100%{opacity:.3;} 50%{opacity:1;} }
</style>
</head>
<body data-state="input">
  <canvas id="viz"></canvas>
  <div id="stage"><div id="compose" contenteditable="true" data-ph="Say or type…"></div></div>
  <button id="submit">→</button>
  <div id="dots"><span></span><span></span><span></span></div>

  <div id="result">
    <div class="col" id="colCmn"><div class="label">Mandarin 普 <button class="spk" data-l="cmn" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button></div><div class="cell zh-cmn" id="cellCmn"></div></div>
    <div class="vline"></div>
    <div class="col" id="colYue"><div class="label">Cantonese 粵 <button class="spk" data-l="yue" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button></div><div class="cell zh-yue" id="cellYue"></div></div>
  </div>

  <button id="cog" class="chip">⚙</button>
  <button id="newbtn" class="chip">＋ New</button>
  <button id="verify" class="chip"><span class="gicon">🌐</span><span class="vdots"><i></i><i></i><i></i></span> Verify</button>
  <div id="pop"></div>

<script>
  var body = document.body;
  var compose = document.getElementById('compose'), submitBtn = document.getElementById('submit');
  function setState(s){ body.setAttribute('data-state', s); hidePop();
    if(haveBridge() && Android.orient) Android.orient(s==='result'?'landscape':'portrait'); }
  function haveBridge(){ return typeof Android !== 'undefined'; }
  var VV = window.visualViewport;
  function vvH(){ return VV ? VV.height : innerHeight; }

  // ---------- ambient wave-ring ----------
  var cv=document.getElementById('viz'), ctx=cv.getContext('2d');
  var W,H,DPR=Math.min(2, Math.max(1, window.devicePixelRatio||1));
  var t=0, pulse=0, curX=0, curY=0, curBase=0;
  function resize(){
    W=cv.width=Math.round(innerWidth*DPR); H=cv.height=Math.round(innerHeight*DPR);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    document.getElementById('stage').style.height=vvH()+'px';   // keep input centered above the keyboard
    if(!curX){ curX=W/2; curY=vvH()*0.5*DPR; curBase=84*DPR; }
    fitCompose();
  }
  window.addEventListener('resize', resize);
  if(VV) VV.addEventListener('resize', resize);
  resize();

  function targets(){
    var st=body.getAttribute('data-state');
    if(st==='result') return { x:W/2, y:H*0.5, base:78*DPR };
    return { x:W/2, y:vvH()*0.5*DPR, base:84*DPR };   // centered in the visible area
  }
  function draw(){
    t+=0.016; pulse+=(( body.getAttribute('data-state')==='sending' ?1:0 )-pulse)*0.08;
    var tg=targets();
    curX+=(tg.x-curX)*0.16; curY+=(tg.y-curY)*0.16; curBase+=(tg.base-curBase)*0.16;
    var st=body.getAttribute('data-state');
    ctx.clearRect(0,0,W,H);
    var base=curBase*(1+pulse*0.12*Math.sin(t*4));
    var gl=ctx.createRadialGradient(curX,curY,base*0.15,curX,curY,base*1.9);
    gl.addColorStop(0,'rgba(106,91,255,'+(0.14+pulse*0.12)+')'); gl.addColorStop(1,'rgba(106,91,255,0)');
    ctx.fillStyle=gl; ctx.fillRect(curX-base*2,curY-base*2,base*4,base*4);
    var grad=ctx.createLinearGradient(curX-base,curY,curX+base,curY);
    grad.addColorStop(0,'#5b78ff'); grad.addColorStop(.5,'#8b5cf6'); grad.addColorStop(1,'#22d3ee');
    ctx.strokeStyle=grad; ctx.lineCap='round'; ctx.lineWidth=Math.max(2, base*0.05);
    var rot=t*0.25, N=64;
    ctx.beginPath();
    for(var i=0;i<N;i++){
      var a=i/N*Math.PI*2+rot, wob=(Math.sin(t*2+i*0.5)+1)/2;
      var len = st==='sending' ? base*0.24*(0.35+0.65*((Math.sin(t*3.2+i*0.4)+1)/2))
                               : base*0.18*(0.55+0.45*wob);
      ctx.moveTo(curX+Math.cos(a)*base, curY+Math.sin(a)*base);
      ctx.lineTo(curX+Math.cos(a)*(base+len), curY+Math.sin(a)*(base+len));
    }
    ctx.stroke();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------- input (Gboard / typing) ----------
  function composeText(){ return (compose.textContent||'').trim(); }
  function fitCompose(){
    if(!compose) return;
    var availH=vvH()*0.78, availW=innerWidth*0.86;
    compose.style.fontSize='120px';
    var h=compose.scrollHeight||1, w=compose.scrollWidth||1;
    var s=Math.min(availH/h, availW/w)*120;
    compose.style.fontSize=Math.max(26, Math.min(s, 320))+'px';
    submitBtn.classList.toggle('show', composeText().length>0);
  }
  compose.addEventListener('input', fitCompose);

  function submit(){
    var v=composeText();
    if(!v) return;
    setState('sending');
    if(haveBridge()) Android.translateText(v);
  }
  submitBtn.addEventListener('click', submit);
  compose.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
  });
  function newInput(){
    compose.textContent=''; setState('input'); fitCompose(); compose.focus();
    if(haveBridge() && Android.focusInput) Android.focusInput();
  }

  // ---------- callbacks from Kotlin ----------
  function setVerifying(on){ var v=document.getElementById('verify'); if(v) v.classList.toggle('loading', on); }
  function setContent(raw){
    if(!raw) return;
    var parts = raw.split('**Cantonese:**');
    document.getElementById('cellCmn').innerHTML = (parts[0]||'').replace('**Mandarin:**','').trim();
    document.getElementById('cellYue').innerHTML = (parts[1]||'').trim();
    setState('result');
    wrapWords();
    requestAnimationFrame(fitText);
    schedulePrefetch();
  }
  function setError(msg){
    document.getElementById('cellCmn').innerHTML = '<div class="err">'+msg+'</div>';
    document.getElementById('cellYue').innerHTML = '';
    setState('result');
  }

  // ---------- fit the result text ----------
  function metrics(){
    var availH = Math.max(80, innerHeight - innerHeight*0.024 - 40 - 26 - 12);
    var availW = Math.max(80, innerWidth*0.40);
    return { w:availW, h:availH };
  }
  function fitSize(cellId){
    var el=document.getElementById(cellId); if(!el || !el.textContent.trim()) return Infinity;
    var m=metrics(); el.style.fontSize='100px';
    var w=el.scrollWidth||1, hh=el.scrollHeight||1;
    return Math.min(m.w/w, m.h/hh)*100;
  }
  function fitText(){
    if(body.getAttribute('data-state')!=='result') return;
    var s=Math.min(fitSize('cellCmn'), fitSize('cellYue'));
    if(!isFinite(s)||s<=0) s=140;
    s=Math.max(46, Math.min(s, 340));
    ['cellCmn','cellYue'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.fontSize=s+'px'; });
    ['colCmn','colYue'].forEach(function(cid){ var c=document.getElementById(cid); if(c) c.classList.toggle('scroll', c.scrollHeight>c.clientHeight+2); });
  }
  window.addEventListener('resize', fitText);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

  // ---------- dictionary pop-out ----------
  var DICT=null;
  (function loadDict(){
    var url='https://storage.googleapis.com/wz-qwen-test-canto-dict/canto-dict.min.json';
    var use=function(j){ DICT=j.entries||j; wrapWords(); };   // dict may land after a result is shown
    var plain=function(){ fetch(url).then(function(r){return r.json();}).then(use).catch(function(){}); };
    try { if(window.caches){ caches.open('lt-dict').then(function(c){ c.match(url).then(function(r){
      if(r) r.json().then(use);
      else fetch(url).then(function(resp){ try{c.put(url,resp.clone());}catch(e){} return resp.json(); }).then(use).catch(function(){});
    }); }); } else plain(); } catch(e){ plain(); }
  })();
  function fwdMatch(text,i){
    if(!DICT) return null;
    var max=Math.min(8, text.length-i);
    for(var n=max;n>=1;n--){ var w=text.substr(i,n); if(DICT[w]) return {word:w, entries:DICT[w]}; }
    return null;
  }
  function segment(text){
    var segs=[], i=0;
    while(i<text.length){ var m=fwdMatch(text,i);
      if(m){ segs.push({s:i, len:m.word.length, entries:m.entries}); i+=m.word.length; } else i++; }
    return segs;
  }
  function toneColor(syl){
    var m={'1':'#e15a5a','2':'#e6a13a','3':'#3fae4f','4':'#5a8fe1','5':'#b06fe0','6':'#9aa0a6'};
    return m[(syl||'').trim().slice(-1)] || '#dfe3ea';
  }
  function pyDiacritic(syl){
    if(!syl) return syl;
    var s=syl.toLowerCase(), tone=0, last=s.charAt(s.length-1);
    if(last>='1'&&last<='5'){ tone=+last; s=s.slice(0,-1); }
    if(s.indexOf('u:')>=0) s=s.replace('u:','ü');
    if(s.indexOf('v')>=0) s=s.replace('v','ü');
    if(!tone || tone===5) return s;
    var marks={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'}, vs='aeiouü', idx=-1;
    if(s.indexOf('a')>=0) idx=s.indexOf('a');
    else if(s.indexOf('e')>=0) idx=s.indexOf('e');
    else if(s.indexOf('ou')>=0) idx=s.indexOf('o');
    else { for(var i=s.length-1;i>=0;i--){ if(vs.indexOf(s.charAt(i))>=0){ idx=i; break; } } }
    if(idx<0) return s;
    var mk=marks[s.charAt(idx)];
    return mk ? s.slice(0,idx)+mk.charAt(tone-1)+s.slice(idx+1) : s;
  }
  function colourReading(r, pinyin){
    return r.split(' ').filter(Boolean).map(function(s){
      return '<span style="color:'+toneColor(s)+'">'+(pinyin?pyDiacritic(s):s)+'</span>';
    }).join(' ');
  }
  function hidePop(){ var p=document.getElementById('pop'); if(p) p.style.display='none'; }

  /** Wrap every dictionary word in its own <span class="w">, reading precomputed. Native
   *  hit-testing then does the work — no caret math, no near-miss dead zones. */
  function wrapWords(){
    if(!DICT) return;                       // re-run when the dict finishes loading
    ['cellCmn','cellYue'].forEach(function(id){
      var cell=document.getElementById(id); if(!cell) return;
      var yue = (id==='cellYue');
      var walker=document.createTreeWalker(cell, NodeFilter.SHOW_TEXT, null, false), nodes=[];
      while(walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function(node){
        if(node.parentElement && node.parentElement.classList.contains('w')) return;  // already wrapped
        var text=node.textContent; if(!text.trim()) return;
        var segs=segment(text); if(!segs.length) return;
        var frag=document.createDocumentFragment(), pos=0;
        segs.forEach(function(s){
          if(s.s>pos) frag.appendChild(document.createTextNode(text.slice(pos,s.s)));
          var e=s.entries[0]||{}, rd = yue ? (e.jy||e.py) : (e.py||e.jy);
          var sp=document.createElement('span');
          sp.className='w'; sp.textContent=text.substr(s.s,s.len);
          if(rd){
            sp.setAttribute('data-rd', rd);
            sp.setAttribute('data-yue', yue?'1':'0');
            var defs=(e.d||[]).map(function(x){ return (x||'').trim(); })
              .filter(function(x){ return x && x.charAt(0)!=='#' && x.indexOf('Mandarin equivalent')!==0; })
              .slice(0,3).join('; ');
            if(defs) sp.setAttribute('data-def', defs);
          }
          frag.appendChild(sp);
          pos=s.s+s.len;
        });
        if(pos<text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
        node.parentNode.replaceChild(frag, node);
      });
    });
  }

  function showPopFor(el){
    var rd=el.getAttribute('data-rd'); if(!rd){ hidePop(); return; }
    var yue=el.getAttribute('data-yue')==='1', defs=el.getAttribute('data-def')||'';
    var pel=document.getElementById('pop');
    pel.innerHTML='<div class="prd">'+colourReading(rd, !yue)+'</div>'+(defs?'<div class="pdef">'+defs+'</div>':'');
    pel.style.display='block';
    var rect=el.getBoundingClientRect(), pw=pel.offsetWidth, ph=pel.offsetHeight;
    pel.style.left=Math.min(Math.max(8,(rect.left+rect.right)/2-pw/2), innerWidth-pw-8)+'px';
    var top=rect.top-ph-12;
    pel.style.top=(top<8 ? Math.min(innerHeight-ph-8, rect.bottom+12) : top)+'px';  // flip below if no room
  }

  document.getElementById('result').addEventListener('click', function(e){
    var el=e.target && e.target.closest ? e.target.closest('.w') : null;
    if(el) showPopFor(el); else hidePop();
  });

  // ---------- TTS (chinese-convo-live Chirp3-HD), pre-generated ----------
  var TTS_URL='https://us-east4-wz-convo-live.cloudfunctions.net/convo_live_generate_audio';
  var ttsAudio=null, ttsCache={}, prefetchTimer=null;
  function fetchTTS(lang, text){
    var k=lang+':'+text;
    if(ttsCache[k]) return ttsCache[k];
    var language=(lang==='yue')?'cantonese':'mandarin';
    ttsCache[k]=fetch(TTS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sentence:text,language:language})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.audio) return j.audio; throw new Error('no audio'); })
      .catch(function(err){ delete ttsCache[k]; throw err; });
    return ttsCache[k];
  }
  function prefetchTTS(){
    var c=document.getElementById('cellCmn').textContent.trim();
    var y=document.getElementById('cellYue').textContent.trim();
    if(c) fetchTTS('cmn',c).catch(function(){});
    if(y) fetchTTS('yue',y).catch(function(){});
  }
  function schedulePrefetch(){ if(prefetchTimer) clearTimeout(prefetchTimer); prefetchTimer=setTimeout(prefetchTTS, 500); }
  function speak(btn, lang, text){
    if(!text) return;
    if(ttsAudio){ try{ ttsAudio.pause(); }catch(e){} }
    btn.classList.remove('err'); btn.classList.add('loading');
    fetchTTS(lang, text).then(function(b64){
      btn.classList.remove('loading'); btn.classList.add('playing');
      ttsAudio=new Audio('data:audio/wav;base64,'+b64);
      ttsAudio.onended=ttsAudio.onerror=function(){ btn.classList.remove('playing'); };
      ttsAudio.play();
    }).catch(function(){ btn.classList.remove('loading'); btn.classList.add('err'); setTimeout(function(){ btn.classList.remove('err'); },1400); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.spk'), function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var l=b.getAttribute('data-l');
      var cell=document.getElementById(l==='cmn'?'cellCmn':'cellYue');
      speak(b, l, cell ? cell.textContent.trim() : '');
    });
  });

  document.getElementById('verify').addEventListener('click', function(){ if(haveBridge()) Android.verify(); });
  document.getElementById('cog').addEventListener('click', function(){ if(haveBridge()) Android.openSettings(); });
  document.getElementById('newbtn').addEventListener('click', newInput);
</script>
</body>
</html>
