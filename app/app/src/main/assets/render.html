<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<style>
  :root { --fg:#f4f5f7; --muted:#8b8f98; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:system-ui,-apple-system,sans-serif; overflow:hidden;
    user-select:none; -webkit-user-select:none; }
  .zh-cmn, .zh-yue { font-family:"Noto Sans TC","Noto Sans HK","PingFang HK","Chiron Hei HK",
    "Hiragino Sans GB","Microsoft JhengHei",system-ui,sans-serif; line-height:1.16; font-weight:500; }

  #viz { position:fixed; inset:0; z-index:1; pointer-events:none; }
  /* the wave-ring IS the control — no mic glyph. Centered; shrinks to the bottom on result. */
  #orb { position:fixed; left:50%; top:44%; width:200px; height:200px; margin:-100px 0 0 -100px;
    border-radius:50%; z-index:5; cursor:pointer;
    transition:top .55s cubic-bezier(.2,.9,.2,1), bottom .55s cubic-bezier(.2,.9,.2,1),
               width .55s cubic-bezier(.2,.9,.2,1), height .55s cubic-bezier(.2,.9,.2,1), margin .55s ease; }
  body[data-state="result"] #orb { top:auto; bottom:4px; width:74px; height:74px; margin:0 0 0 -37px; }

  #status { position:fixed; left:0; right:0; top:calc(44% + 96px); z-index:4; pointer-events:none;
    text-align:center; padding:0 10vw; color:var(--muted); font-size:1rem; line-height:1.4;
    min-height:1.3em; transition:opacity .3s ease; }
  body[data-state="result"] #status { opacity:0; }

  /* two columns, EQUAL weight; each cell shrinks to its text so it can be scaled up to fill */
  #result { position:fixed; inset:0; z-index:2; padding:2.4vh 2vw 74px;
    display:flex; flex-direction:row; align-items:stretch;
    opacity:0; transform:translateY(16px); pointer-events:none;
    transition:opacity .5s ease, transform .55s cubic-bezier(.2,.9,.2,1); }
  body[data-state="result"] #result { opacity:1; transform:none; pointer-events:auto; }
  .col { flex:1 1 0; min-width:0; padding:0 3vw; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
  .col.scroll { justify-content:flex-start; }
  .col::-webkit-scrollbar { width:4px; }
  .col::-webkit-scrollbar-thumb { background:#ffffff2a; border-radius:4px; }
  .vline { width:1px; background:#ffffff12; align-self:stretch; margin:6vh 0; }
  .label { font-size:.58rem; letter-spacing:.24em; text-transform:uppercase;
    color:var(--muted); margin-bottom:.5rem; }
  .cell { display:inline-block; max-width:100%; }
  .err { color:#ff8a80; font-size:1.05rem; text-align:center; }

  .chip { background:#111420; color:var(--muted); border:1px solid #ffffff14; border-radius:999px;
    padding:.55rem .95rem; font-size:.95rem; cursor:pointer; }
  #kb { position:fixed; left:16px; bottom:20px; z-index:6; display:inline-block; }
  #cog { position:fixed; left:14px; top:12px; z-index:6; opacity:.6; padding:.4rem .7rem; }
  #verify { position:fixed; right:16px; bottom:20px; z-index:6; display:none; }
  body[data-state="result"] #verify { display:inline-block; }
  /* transcript / manual entry: big centered editable text, no box (rendered like the result) */
  #compose { display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:7;
    width:86vw; max-height:64vh; background:transparent; border:none; outline:none; resize:none;
    color:var(--fg); font-size:2.6rem; font-weight:500; line-height:1.3; text-align:center;
    caret-color:#7c9cff; overflow:auto; }
  #composehint { display:none; position:fixed; left:0; right:0; bottom:6vh; z-index:7;
    text-align:center; color:var(--muted); font-size:.85rem; }
  body.composing #compose, body.composing #composehint { display:block; }
  body.composing #orb, body.composing #status, body.composing #result, body.composing #viz { opacity:0; pointer-events:none; }
  /* send arrow: same white, weight and font as the words — reads as part of the type, no chrome */
  #submit { display:none; position:fixed; right:5vw; top:50%; transform:translateY(-50%); z-index:8;
    background:none; border:none; cursor:pointer; font-family:inherit; color:var(--fg); font-weight:500;
    line-height:1; font-size:2.8rem; padding:.2rem .5rem; transition:opacity .15s ease, transform .12s ease; }
  #submit:active { transform:translateY(-50%) scale(.86); opacity:.55; }
  body.composing #submit { display:block; }
  #badge { position:fixed; top:2.4vh; right:3vw; z-index:8; display:none;
    background:#141824; color:#cdd7ff; border:1px solid #2b3350; border-radius:999px;
    padding:.5rem 1rem; font-size:.92rem; animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:.95;} }
  /* pronunciation pop-out (reading only) */
  #pop { position:fixed; z-index:9; display:none; background:#0d1017f2; border:1px solid #ffffff1f;
    border-radius:14px; padding:.55rem .95rem; box-shadow:0 8px 30px #000a;
    text-align:center; max-width:min(66vw,380px); }
  #pop .prd { font-size:1.7rem; font-weight:600; letter-spacing:.02em; }
  #pop .pdef { font-size:.82rem; font-weight:400; color:var(--muted); margin-top:.28rem; line-height:1.3; }
  /* speaker icon next to the 普/粵 labels */
  .spk { background:none; border:none; padding:0 0 0 6px; cursor:pointer; vertical-align:middle; line-height:0; }
  .spk svg { width:15px; height:15px; fill:none; stroke:var(--muted); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .spk:active svg { stroke:var(--fg); }
  .spk.playing svg { stroke:#7c9cff; }
  .spk.loading svg { animation:spkpulse 1s ease-in-out infinite; }
  .spk.err svg { stroke:#ff8a80; }
  @keyframes spkpulse { 0%,100%{opacity:.3;} 50%{opacity:1;} }
</style>
</head>
<body data-state="idle">
  <canvas id="viz"></canvas>
  <div id="orb"></div>
  <div id="status">Tap to speak</div>

  <div id="result">
    <div class="col" id="colCmn"><div class="label">Mandarin 普 <button class="spk" data-l="cmn" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button></div><div class="cell zh-cmn" id="cellCmn"></div></div>
    <div class="vline"></div>
    <div class="col" id="colYue"><div class="label">Cantonese 粵 <button class="spk" data-l="yue" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button></div><div class="cell zh-yue" id="cellYue"></div></div>
  </div>

  <button id="cog" class="chip">⚙</button>
  <button id="kb" class="chip">⌨</button>
  <button id="verify" class="chip">🌐 Verify</button>
  <textarea id="compose" rows="1" placeholder="Say or type…" autocomplete="off" enterkeyhint="go"></textarea>
  <button id="submit">→</button>
  <div id="composehint">tap the text to edit</div>
  <div id="badge">🌐 verifying…</div>
  <div id="pop"></div>

<script>
  var body = document.body;
  function setState(s){ body.setAttribute('data-state', s); hidePop(); }
  function status(t){ document.getElementById('status').textContent = t || ''; }
  function haveBridge(){ return typeof Android !== 'undefined'; }

  // ---------- living wave-ring ----------
  var cv = document.getElementById('viz'), ctx = cv.getContext('2d');
  var W,H,DPR=Math.min(2, Math.max(1, window.devicePixelRatio||1));  // cap render resolution -> fewer pixels -> smoother
  var t=0, amp=0, ampTarget=0, pop=1, ripples=[];
  var curX=0, curY=0, curBase=0;
  function resize(){
    W=cv.width=Math.round(innerWidth*DPR); H=cv.height=Math.round(innerHeight*DPR);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';  // pin CSS size to viewport (fixes off-center)
    if(!curX){ curX=W/2; curY=H*0.44; curBase=82*DPR; }
  }
  window.addEventListener('resize', resize); resize();
  function targets(){
    if(body.getAttribute('data-state')==='result') return { x:W/2, y:H-42*DPR, base:26*DPR };
    return { x:W/2, y:H*0.44, base:82*DPR };
  }
  function boop(){ pop=1.34; ripples.push({r:curBase, a:.9}); if(navigator.vibrate) navigator.vibrate(12); }

  function draw(){
    t += 0.016; amp += (ampTarget-amp)*0.16; pop += (1-pop)*0.16;
    var tg=targets();
    curX += (tg.x-curX)*0.18; curY += (tg.y-curY)*0.18; curBase += (tg.base-curBase)*0.18;
    var st=body.getAttribute('data-state');
    ctx.clearRect(0,0,W,H);
    for(var k=ripples.length-1;k>=0;k--){
      var rp=ripples[k]; rp.r += 5*DPR; rp.a *= 0.93;
      if(rp.a<0.03){ ripples.splice(k,1); continue; }
      ctx.beginPath(); ctx.arc(curX,curY,rp.r,0,Math.PI*2);
      ctx.strokeStyle='rgba(124,156,255,'+rp.a+')'; ctx.lineWidth=2*DPR; ctx.stroke();
    }
    var base=curBase*pop;
    // cheap soft glow: ONE radial fill (per-stroke shadowBlur was the lag — very slow in WebView)
    var gl=ctx.createRadialGradient(curX,curY,base*0.15,curX,curY,base*1.9);
    gl.addColorStop(0,'rgba(106,91,255,0.16)'); gl.addColorStop(1,'rgba(106,91,255,0)');
    ctx.fillStyle=gl; ctx.fillRect(curX-base*2,curY-base*2,base*4,base*4);

    var grad=ctx.createLinearGradient(curX-base,curY,curX+base,curY);
    grad.addColorStop(0,'#5b78ff'); grad.addColorStop(.5,'#8b5cf6'); grad.addColorStop(1,'#22d3ee');
    ctx.strokeStyle=grad; ctx.lineCap='round'; ctx.lineWidth=Math.max(2, base*0.05);
    var rot=t*0.25, N=64;
    ctx.beginPath();                        // ONE batched path for all bars (was 72 separate strokes)
    for(var i=0;i<N;i++){
      var a=i/N*Math.PI*2 + rot;
      var wob=(Math.sin(t*2+i*0.5)+1)/2;
      var len;
      if(st==='listening')      len = base*(0.16 + amp*1.3*wob);
      else if(st==='thinking')  len = base*0.24*(0.35 + 0.65*((Math.sin(t*3.2+i*0.4)+1)/2));
      else                      len = base*0.20*(0.55 + 0.45*wob);
      ctx.moveTo(curX+Math.cos(a)*base,       curY+Math.sin(a)*base);
      ctx.lineTo(curX+Math.cos(a)*(base+len), curY+Math.sin(a)*(base+len));
    }
    ctx.stroke();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function toggleVoice(){
    boop();
    if(!haveBridge()) return;
    if(body.getAttribute('data-state')==='listening') Android.stopVoice(); else Android.startVoice();
  }
  document.getElementById('orb').addEventListener('click', toggleVoice);

  // ---------- callbacks from Kotlin ----------
  function onListening(){ setState('listening'); status('Listening…'); }
  function onAmplitude(x){ ampTarget = Math.max(0, Math.min(1, x)); }
  function onPartial(t){ if(t) status(t); }
  function onHeard(t){ status(t); }
  function reviewHeard(t){ showCompose(t || '', false); }   // transcript shown big, no keyboard; tap → to translate or tap text to edit
  function setThinking(){ setState('thinking'); status('translating…'); ampTarget=0; }
  function setBusy(){ setThinking(); }
  function onVoiceError(msg){ setState('idle'); status(msg || 'Tap to try again'); ampTarget=0; }
  function resetIdle(){ setState('idle'); status('Tap to speak'); ampTarget=0; }
  function setVerifying(on){ document.getElementById('badge').style.display = on?'block':'none'; }

  function setContent(raw){
    if(!raw) return;
    var parts = raw.split('**Cantonese:**');
    document.getElementById('cellCmn').innerHTML = (parts[0]||'').replace('**Mandarin:**','').trim();
    document.getElementById('cellYue').innerHTML = (parts[1]||'').trim();
    setState('result');
    requestAnimationFrame(fitText);
    schedulePrefetch();                 // pre-generate audio so the speaker is instant
  }
  function setError(msg){
    document.getElementById('cellCmn').innerHTML = '<div class="err">'+msg+'</div>';
    document.getElementById('cellYue').innerHTML = '';
    setState('result');
  }

  // ---------- fit: scale text to fill, measured against the window (EQUAL both columns) ----------
  function metrics(){
    var availH = Math.max(80, innerHeight - innerHeight*0.024 - 86 - 26 - 12); // -toppad -bottombar -label -gap
    var availW = Math.max(80, innerWidth*0.40);                                 // per-column text width
    return { w:availW, h:availH };
  }
  function fitSize(cellId){
    var el=document.getElementById(cellId); if(!el || !el.textContent.trim()) return Infinity;
    var m=metrics(); el.style.fontSize='100px';
    var w=el.scrollWidth||1, hh=el.scrollHeight||1;
    return Math.min(m.w/w, m.h/hh)*100;
  }
  function fitText(){
    if(body.getAttribute('data-state')!=='result') return;
    var s=Math.min(fitSize('cellCmn'), fitSize('cellYue'));
    if(!isFinite(s)||s<=0) s=140;
    s=Math.max(46, Math.min(s, 340));
    ['cellCmn','cellYue'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.fontSize=s+'px'; });
    ['colCmn','colYue'].forEach(function(cid){ var c=document.getElementById(cid); if(c) c.classList.toggle('scroll', c.scrollHeight>c.clientHeight+2); });
  }
  window.addEventListener('resize', fitText);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

  // ---------- dictionary pop-out (pronunciation only, tap ON a word) ----------
  var DICT=null;
  (function loadDict(){
    var url='https://storage.googleapis.com/wz-qwen-test-canto-dict/canto-dict.min.json';
    var use=function(j){ DICT=j.entries||j; };
    var plain=function(){ fetch(url).then(function(r){return r.json();}).then(use).catch(function(){}); };
    try { if(window.caches){ caches.open('lt-dict').then(function(c){ c.match(url).then(function(r){
      if(r) r.json().then(use);
      else fetch(url).then(function(resp){ try{c.put(url,resp.clone());}catch(e){} return resp.json(); }).then(use).catch(function(){});
    }); }); } else plain(); } catch(e){ plain(); }
  })();

  function fwdMatch(text,i){
    if(!DICT) return null;
    var max=Math.min(8, text.length-i);
    for(var n=max;n>=1;n--){ var w=text.substr(i,n); if(DICT[w]) return {word:w, entries:DICT[w]}; }
    return null;
  }
  function segment(text){                    // FMM left->right; every char lands in a segment
    var segs=[], i=0;
    while(i<text.length){
      var m=fwdMatch(text,i);
      if(m){ segs.push({s:i, len:m.word.length, entries:m.entries}); i+=m.word.length; }
      else { i++; }
    }
    return segs;
  }
  function toneColor(syl){
    var m={'1':'#e15a5a','2':'#e6a13a','3':'#3fae4f','4':'#5a8fe1','5':'#b06fe0','6':'#9aa0a6'};
    return m[(syl||'').trim().slice(-1)] || '#dfe3ea';
  }
  // numbered Mandarin pinyin -> tone marks (jian3 -> jiǎn). Standard vowel-placement, no regex.
  function pyDiacritic(syl){
    if(!syl) return syl;
    var s=syl.toLowerCase(), tone=0, last=s.charAt(s.length-1);
    if(last>='1'&&last<='5'){ tone=+last; s=s.slice(0,-1); }
    if(s.indexOf('u:')>=0) s=s.replace('u:','ü');
    if(s.indexOf('v')>=0) s=s.replace('v','ü');
    if(!tone || tone===5) return s;                       // neutral tone: no mark
    var marks={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'}, vs='aeiouü', idx=-1;
    if(s.indexOf('a')>=0) idx=s.indexOf('a');             // a wins
    else if(s.indexOf('e')>=0) idx=s.indexOf('e');        // then e
    else if(s.indexOf('ou')>=0) idx=s.indexOf('o');       // ou -> o
    else { for(var i=s.length-1;i>=0;i--){ if(vs.indexOf(s.charAt(i))>=0){ idx=i; break; } } }  // else last vowel
    if(idx<0) return s;
    var mk=marks[s.charAt(idx)];
    return mk ? s.slice(0,idx)+mk.charAt(tone-1)+s.slice(idx+1) : s;
  }
  function colourReading(r, pinyin){
    return r.split(' ').filter(Boolean).map(function(s){
      var disp = pinyin ? pyDiacritic(s) : s;
      return '<span style="color:'+toneColor(s)+'">'+disp+'</span>';   // colour by the original tone digit
    }).join(' ');
  }
  function hidePop(){ var p=document.getElementById('pop'); if(p) p.style.display='none'; }

  function showPronAt(x,y){
    if(!DICT){ hidePop(); return; }
    var range = document.caretRangeFromPoint ? document.caretRangeFromPoint(x,y)
              : (document.caretPositionFromPoint ? (function(){var p=document.caretPositionFromPoint(x,y); return p&&{startContainer:p.offsetNode,startOffset:p.offset};})() : null);
    if(!range || !range.startContainer || range.startContainer.nodeType!==3){ hidePop(); return; }
    var node=range.startContainer, off=range.startOffset, text=node.textContent;
    var segs=segment(text), seg=null;
    for(var k=0;k<segs.length;k++){ if(off>=segs[k].s && off<segs[k].s+segs[k].len){ seg=segs[k]; break; } }
    if(!seg && off>0){ for(var k=0;k<segs.length;k++){ if(off-1>=segs[k].s && off-1<segs[k].s+segs[k].len){ seg=segs[k]; break; } } }
    if(!seg){ hidePop(); return; }
    var r=document.createRange(); r.setStart(node,seg.s); r.setEnd(node,seg.s+seg.len);
    var rect=r.getBoundingClientRect();
    if(x<rect.left-10 || x>rect.right+10 || y<rect.top-16 || y>rect.bottom+16){ hidePop(); return; }  // tapped empty space
    var yue = !!(node.parentElement && node.parentElement.closest('#colYue'));
    var e=seg.entries[0]||{}, rd = yue ? (e.jy||e.py) : (e.py||e.jy);
    if(!rd){ hidePop(); return; }
    var defs=(e.d||[]).map(function(s){ return (s||'').trim(); })
      .filter(function(s){ return s && s.charAt(0)!=='#' && s.indexOf('Mandarin equivalent')!==0; })
      .slice(0,3).join('; ');
    var pel=document.getElementById('pop');
    pel.innerHTML='<div class="prd">'+colourReading(rd, !yue)+'</div>'+(defs?'<div class="pdef">'+defs+'</div>':'');
    pel.style.display='block';
    var pw=pel.offsetWidth, ph=pel.offsetHeight;
    pel.style.left=Math.min(Math.max(8,(rect.left+rect.right)/2-pw/2), innerWidth-pw-8)+'px';
    pel.style.top =Math.max(8, rect.top-ph-12)+'px';
  }
  document.getElementById('result').addEventListener('click', function(e){ showPronAt(e.clientX, e.clientY); });
  document.getElementById('pop').addEventListener('click', hidePop);
  // TTS from chinese-convo-live's deployed function (Chirp3-HD). Pre-generated in the background the
  // instant a result renders, so tapping the speaker is instant; a pulse shows if you tap before it's ready.
  var TTS_URL='https://us-east4-wz-convo-live.cloudfunctions.net/convo_live_generate_audio';
  var ttsAudio=null, ttsCache={}, prefetchTimer=null;
  function fetchTTS(lang, text){
    var k=lang+':'+text;
    if(ttsCache[k]) return ttsCache[k];                       // in-flight or done (a Promise)
    var language=(lang==='yue')?'cantonese':'mandarin';
    ttsCache[k]=fetch(TTS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sentence:text,language:language})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.audio) return j.audio; throw new Error('no audio'); })
      .catch(function(err){ delete ttsCache[k]; throw err; });  // drop on failure so it can retry
    return ttsCache[k];
  }
  function prefetchTTS(){
    var c=document.getElementById('cellCmn').textContent.trim();
    var y=document.getElementById('cellYue').textContent.trim();
    if(c) fetchTTS('cmn',c).catch(function(){});
    if(y) fetchTTS('yue',y).catch(function(){});
  }
  function schedulePrefetch(){ if(prefetchTimer) clearTimeout(prefetchTimer); prefetchTimer=setTimeout(prefetchTTS, 500); }
  function speak(btn, lang, text){
    if(!text) return;
    if(ttsAudio){ try{ ttsAudio.pause(); }catch(e){} }
    btn.classList.remove('err'); btn.classList.add('loading');
    fetchTTS(lang, text).then(function(b64){
      btn.classList.remove('loading'); btn.classList.add('playing');
      ttsAudio=new Audio('data:audio/wav;base64,'+b64);
      ttsAudio.onended=ttsAudio.onerror=function(){ btn.classList.remove('playing'); };
      ttsAudio.play();
    }).catch(function(){ btn.classList.remove('loading'); btn.classList.add('err'); setTimeout(function(){ btn.classList.remove('err'); },1400); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.spk'), function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var l=b.getAttribute('data-l');
      var cell=document.getElementById(l==='cmn'?'cellCmn':'cellYue');
      speak(b, l, cell ? cell.textContent.trim() : '');
    });
  });

  // ---------- text fallback + verify ----------
  var kb=document.getElementById('kb'), compose=document.getElementById('compose'), submitBtn=document.getElementById('submit');
  function showCompose(text, focus){
    compose.value=text||''; body.classList.add('composing'); hidePop(); ampTarget=0;
    if(focus){ compose.focus(); var L=compose.value.length; try{ compose.setSelectionRange(L,L); }catch(e){} }
    else { compose.blur(); }
  }
  function hideCompose(){ body.classList.remove('composing'); compose.blur(); }
  function doSubmit(){ var v=compose.value.trim(); if(v && haveBridge()){ hideCompose(); Android.translateText(v); } }
  submitBtn.addEventListener('click', doSubmit);
  kb.addEventListener('click', function(){
    if(body.classList.contains('composing')) hideCompose();
    else { if(haveBridge()) Android.stopVoice(); showCompose('', true); }   // manual typing: focus for keyboard
  });
  compose.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSubmit(); }
  });
  document.getElementById('verify').addEventListener('click', function(){ if(haveBridge()) Android.verify(); });
  document.getElementById('cog').addEventListener('click', function(){ if(haveBridge()) Android.openSettings(); });
</script>
</body>
</html>
