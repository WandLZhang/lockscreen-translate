name: build-lockscreen-translate-apk
on:
  push:
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: app
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lockscreen-translate-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a rolling release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lockscreen-translate-latest
          name: lockscreen-translate (latest debug build)
          files: app/app/build/outputs/apk/debug/app-debug.apk
